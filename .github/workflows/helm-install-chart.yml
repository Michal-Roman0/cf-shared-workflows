# This is a basic workflow to help you get started with Actions

name: Helm Install Chart

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string

      # AWS specifics
      aws_region:
        required: true
        type: string
      cluster_creation_role_arn:
        required: true
        type: string

      kubernetes_namespace:
        required: false
        type: string
        default: default

      # Database config
      db_host:
        required: false
        type: string
      db_port:
        required: false
        type: string
      db_name:
        required: false
        type: string
        
jobs:
  apply_kubernetes_resources: 
      name: Deploy nginx to EKS
      runs-on: ubuntu-latest
      
      permissions:
        id-token: write   # required for OIDC
        contents: read
  
      env:
        KUBE_NAMESPACE: ${{ inputs.kubernetes_namespace }}
        
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
          
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6.0.0
          with:
            aws-region: ${{ inputs.aws_region }}
            role-to-assume: ${{ inputs.cluster_creation_role_arn }}
            role-session-name: Github-Kubernetes
  
        - name: Setup kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: "latest"
  
        - name: Update kubeconfig for EKS
          run: |
            aws eks update-kubeconfig \
              --region eu-central-1 \
              --name task-eks

        - name: Install eksctl
          run: |
            ARCH=amd64
            PLATFORM=$(uname -s)_$ARCH
            curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$PLATFORM.tar.gz"
            
            # (Optional) Verify checksum
            curl -sL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_checksums.txt" | grep $PLATFORM | sha256sum --check
            
            tar -xzf eksctl_$PLATFORM.tar.gz -C /tmp && rm eksctl_$PLATFORM.tar.gz
            
            sudo install -m 0755 /tmp/eksctl /usr/local/bin && rm /tmp/eksctl

        - name: Add ECR secret
          run: |
            kubectl create secret docker-registry ecr-secret \
            --docker-server=097853039117.dkr.ecr.eu-west-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region eu-west-1) \
            --namespace myapp --dry-run=client -o yaml | kubectl apply -f -
            
            
        - name: Install Helm
          run: |
            curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
            chmod 700 get_helm.sh
            ./get_helm.sh
            

  
        - name: Deploy with Helm (With Database)
          if: ${{ inputs.db_host != '' }}
          run: |
            helm upgrade --install payment-app ./helm-k8s-app \
              --namespace ${{ inputs.kubernetes_namespace }} \
              --create-namespace \
              --set dbHost=${{ inputs.db_host }} \
              --set dbPort=${{ inputs.db_port }} \
              --set dbName=${{ inputs.db_name }} \
              --set dbUsername=${{ secrets.DB_USER }} \
              --set dbPassword=${{ secrets.DB_PASSWORD }}
