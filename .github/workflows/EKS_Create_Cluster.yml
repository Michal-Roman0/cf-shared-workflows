# This is a basic workflow to help you get started with Actions

name: EKS Create Cluster

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  apply_kubernetes_resources: 
      if: ${{ github.event_name == 'workflow_dispatch' }}
      name: Deploy nginx to EKS
      runs-on: ubuntu-latest
      
      permissions:
        id-token: write   # required for OIDC
        contents: read
  
      env:
        KUBE_NAMESPACE: nginx-test
        
      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
          
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v6.0.0
          with:
            aws-region: ${{ vars.AWS_REGION }}
            role-to-assume: arn:aws:iam::097853039117:role/github-terraform-plan
            role-session-name: Github-Kubernetes
  
        - name: Setup kubectl
          uses: azure/setup-kubectl@v4
          with:
            version: "latest"
  
        - name: Update kubeconfig for EKS
          run: |
            aws eks update-kubeconfig \
              --region eu-central-1 \
              --name task-eks
        - name: Deploy nginx (Deployment + LoadBalancer Service)
          working-directory: "Cloud_Cluster_EKS"
          run: |
            # Deploy nginx
            if kubectl get namespace "$KUBE_NAMESPACE" >/dev/null 2>&1; then
              echo "Namespace $KUBE_NAMESPACE already exists"
            else
              kubectl create namespace $KUBE_NAMESPACE
            fi
            # kubectl run nginx --image=nginx:latest --port=80 --namespace=nginx-test
            # kubectl expose pod nginx --port=80 --type=LoadBalancer --name=nginx-service --namespace=nginx-test
            kubectl apply -f eks-test-pod.yaml
        # - name: Wait for deployment
        #   run: kubectl rollout status deployment/nginx --timeout=60s
  
        - name: Wait for LoadBalancer
          run: |
            echo "Waiting for AWS LoadBalancer provisioning..."
            for i in {1..18}; do
              HOSTNAME=$(kubectl get svc test-svc -n $KUBE_NAMESPACE -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
              if [ -n "$HOSTNAME" ]; then
                echo "Deployment finished"
                echo "Service available at: http://$HOSTNAME"
                echo "## Nginx Service" >> $GITHUB_STEP_SUMMARY
                echo "http://$HOSTNAME" >> $GITHUB_STEP_SUMMARY
                break
              fi
              echo "Pending... (attempt $i/18)"
              sleep 10
            done
            if [ -z "$HOSTNAME" ]; then
              echo "LoadBalancer still pending after 3 minutes. Check AWS console."
              kubectl get svc test-svc -n $KUBE_NAMESPACE
            fi
